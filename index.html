<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1030">
  <meta name="description" content="Offline-first currency converter for EUR, PLN and TRY.">
  <title>Currency Converter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script type="module" src="./src/main.ts"></script>
</head>
<body>
  <main>
    <header class="app-header">
      <h1>Currency Converter</h1>
      <p>EUR · PLN · TRY – works offline</p>
    </header>

    <section class="converter glass" aria-label="Converter">
      <form id="converter" class="converter-form" autocomplete="off">
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="text" inputmode="decimal" value="1" aria-describedby="amount-error">
          <p id="amount-error" class="error" hidden>Enter a valid non-negative number.</p>
        </div>

        <div class="fields">
          <div class="field">
            <label for="from">From</label>
            <select id="from" name="from">
              <option value="EUR" selected>EUR – Euro</option>
              <option value="PLN">PLN – Polish złoty</option>
              <option value="TRY">TRY – Turkish lira</option>
            </select>
          </div>
          <div class="field">
            <label for="to">To</label>
            <select id="to" name="to">
              <option value="EUR">EUR – Euro</option>
              <option value="PLN" selected>PLN – Polish złoty</option>
              <option value="TRY">TRY – Turkish lira</option>
            </select>
          </div>
        </div>
      </form>

      <div class="result" aria-live="polite">
        <output id="result" for="amount from to">—</output>
        <p id="rate" class="rate"></p>
      </div>
    </section>

    <section id="status" class="status glass" data-state="loading" role="status">
      <p id="status-title" class="status-title">Loading rates…</p>
      <p id="status-detail" class="status-detail"></p>
    </section>

    <button id="refresh" type="button">Refresh rates</button>

    <p class="source">Rates: European Central Bank via <a href="https://frankfurter.dev/" rel="noopener">Frankfurter</a>. Published once per working day.</p>
  </main>
</body>
</html>
